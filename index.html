<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#094d47">
  <title>Czas pracy, RM Nieruchomości</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="app">

  <header>
    <div class="header-left">
      <img src="logo.png" alt="RM Nieruchomości" class="header-logo">
      <div class="subtitle">Czas pracy</div>
    </div>
    <div class="header-right">
      <span class="wersja" data-wersja title="Wersja aplikacji"></span>
      <button class="icon-btn" id="btn-ustawienia" hidden aria-label="Ustawienia">⚙</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <!-- LOGOWANIE -->
  <section class="screen" id="ekran-logowanie" hidden>
    <div class="card">
      <div class="card-title">Zaloguj się</div>
      <p class="muted">Ten sam e-mail i hasło co w aplikacji Zadania RM.</p>
      <form id="form-logowanie">
        <label>E-mail <input type="email" id="log-email" autocomplete="username" autocapitalize="off" required></label>
        <label>Hasło <input type="password" id="log-haslo" autocomplete="current-password" required></label>
        <button class="btn btn-main" type="submit">Zaloguj</button>
        <p class="blad" id="log-blad"></p>
      </form>
    </div>
  </section>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="dzis" class="on">Dziś</button>
    <button data-tab="tydzien">Tydzień</button>
    <button data-tab="miesiac">Miesiąc</button>
  </nav>

  <section class="screen" id="ekran-dzis" hidden></section>
  <section class="screen" id="ekran-tydzien" hidden></section>
  <section class="screen" id="ekran-miesiac" hidden></section>

  <!-- ARKUSZ: wpis ręczny / zmiana / ustawienia -->
  <div class="tlo" id="tlo" hidden></div>
  <div class="arkusz" id="arkusz" hidden role="dialog" aria-modal="true">
    <div class="ark-gora"><b id="ark-tytul"></b><button class="icon-btn dark" id="ark-zamknij" aria-label="Zamknij">×</button></div>
    <div id="ark-tresc"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js?v=1"></script>
<script src="app.js?v=1" defer></script>
</body>
</html>
